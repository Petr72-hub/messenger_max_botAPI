[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxgram"
version = "0.1.0"
description = "Asynchronous framework for MAX messenger Bot API, designed after aiogram"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "maxgram contributors" }]
keywords = ["max", "messenger", "bot", "api", "asyncio", "aiogram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.9", "ruff>=0.4"]
redis = ["redis>=5.0"]

[project.urls]
Homepage = "https://github.com/"
Documentation = "https://dev.max.ru/docs-api"

[tool.hatch.build.targets.wheel]
packages = ["maxgram"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
